name: SPMS Full-Stack CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linting
        run: |
          ruff check app tests

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: .
          MONGODB_URL: "mongodb://localhost:27017"
          SECRET_KEY: "synthetic-ci-pipeline-key-minimum-32-characters-long!"
          DATABASE_NAME: "spms_ci_test"
          ENVIRONMENT: "development"
          BACKEND_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
        run: |
          pytest tests/unit/ tests/integration/test_api_endpoints.py -v --cov=app --cov-report=term-missing

  frontend-ci:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Production Bundle Build
        run: npm run build

  docker-ci:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: spms-backend:ci-test

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: spms-frontend:ci-test

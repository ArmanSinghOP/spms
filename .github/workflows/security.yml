name: Security & Secret Scanning

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true

      - name: Verify Environment Exclusion (.env protection)
        run: |
          echo "Verifying .env files are excluded from Git..."
          if git ls-files | grep -E "(^|/)\.env($|\..*)"; then
            echo "ERROR: Tracked .env file detected in Git index!"
            exit 1
          fi
          echo ".env file exclusion verified."

  backend-security-tests:
    name: Backend Security & Regression Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Security and Unit Tests
        env:
          PYTHONPATH: backend
          MONGODB_URL: "mongodb://localhost:27017"
          SECRET_KEY: "synthetic-ci-test-key-minimum-32-characters-long!"
          DATABASE_NAME: "spms_ci_test"
          ENVIRONMENT: "development"
          BACKEND_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
        run: |
          python -m pytest backend/tests/unit/test_security_auth.py backend/tests/unit/test_cors_security.py backend/tests/unit/test_eligibility.py backend/tests/unit/test_eligibility_extended.py -v
